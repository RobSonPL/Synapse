    <!-- Service Worker Registration for PWA & Offline Access -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {

            .catch(function(err) {

        });

    </script>

    <!-- Core Web Vitals: External Scripts Deferred to Post-Interaction / Idle Phase -->
    <script>
      (function() {
        var initialized = false;
        function triggerAnalytics() {
          if (initialized) return;
          initialized = true;
          cleanup();

          // Load Meta Pixel
          !function(f,b,e,v,n,t,s)
          {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};
          if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
          n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t,s)}(window, document,'script',
          'https://connect.facebook.net/en_US/fbevents.js');
          if (window.fbq) {
            fbq('init', '1441563257969470');
            fbq('track', 'PageView');
          }

          // Load Google Analytics (gtag.js)
          var gaScript = document.createElement('script');
          gaScript.async = true;
          gaScript.src = "https://www.googletagmanager.com/gtag/js?id=G-HP94YEHWZT";
          document.head.appendChild(gaScript);
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-HP94YEHWZT');
        }

        var events = ['pointerdown', 'touchstart', 'scroll', 'keydown'];
        function onUserActivity() {
          triggerAnalytics();
        }

        function cleanup() {
          events.forEach(function(evt) {
            window.removeEventListener(evt, onUserActivity, { passive: true });
          });
        }

        events.forEach(function(evt) {
          window.addEventListener(evt, onUserActivity, { passive: true, once: true });
        });

        // Fallback idle timer if no interaction occurs within 4s
        window.addEventListener('load', function() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(function() {
              setTimeout(triggerAnalytics, 3500);
            });
          } else {
            setTimeout(triggerAnalytics, 4000);
          }
        });
      })();
    </script>
