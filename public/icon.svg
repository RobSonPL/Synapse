<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0c1228" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="synapseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" stroke="url(#synapseGrad)" stroke-width="8" stroke-dasharray="16 8" opacity="0.4" />
  <circle cx="256" cy="256" r="170" stroke="url(#synapseGrad)" stroke-width="4" opacity="0.6" />
  <g filter="url(#glow)">
    <path
      d="M340 150 C 225 150, 150 220, 256 265 C 360 310, 280 395, 170 365"
      stroke="url(#synapseGrad)"
      stroke-width="36"
      stroke-linecap="round"
      fill="none"
    />
    <circle cx="340" cy="150" r="18" fill="#00f5ff" />
    <circle cx="256" cy="265" r="16" fill="#0ea5e9" />
    <circle cx="170" cy="365" r="18" fill="#8b5cf6" />
  </g>
</svg>
