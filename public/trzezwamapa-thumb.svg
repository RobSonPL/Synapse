<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="tm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>
    
    <linearGradient id="tm-card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>

    <linearGradient id="tm-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="tm-pin-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="tm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="tm-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#tm-bg)" />
  <rect width="800" height="600" fill="url(#tm-grid)" />

  <!-- Map Graphic Features (Roads / Topo lines) -->
  <g opacity="0.35">
    <path d="M -50 180 Q 200 120 420 220 T 850 180" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
    <path d="M 120 -50 Q 180 250 250 380 T 310 650" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" />
    <path d="M -20 400 Q 260 380 500 480 T 820 420" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <path d="M 520 -50 Q 560 220 620 420 T 700 650" fill="none" stroke="#0369a1" stroke-width="3" stroke-linecap="round" />
    <path d="M 300 200 Q 450 350 720 300" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="6,6" />
    
    <!-- Water body area -->
    <path d="M 580 440 C 650 430 750 490 800 520 L 800 600 L 520 600 Z" fill="#0c4a6e" opacity="0.4" />
  </g>

  <!-- Top App Navigation Bar -->
  <g transform="translate(40, 30)">
    <rect width="720" height="64" rx="16" fill="url(#tm-card-bg)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.5))" />
    
    <!-- App Logo & Title -->
    <circle cx="36" cy="32" r="16" fill="#0284c7" />
    <path d="M 36 22 L 44 38 L 28 38 Z" fill="#ffffff" opacity="0.9" />
    <circle cx="36" cy="32" r="4" fill="#0f172a" />
    
    <text x="64" y="29" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">TRZEŹWA MAPA</text>
    <text x="64" y="44" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.3">trzezwamapa.pl • Baza Wsparcia</text>

    <!-- Search Box Mockup -->
    <g transform="translate(280, 14)">
      <rect width="270" height="36" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <circle cx="18" cy="18" r="5" fill="none" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="22" y1="22" x2="26" y2="26" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <text x="34" y="22" fill="#64748b" font-family="sans-serif" font-size="12">Szukaj miasta, grupy AA, mitingu...</text>
    </g>

    <!-- Live Status Badge -->
    <g transform="translate(570, 17)">
      <rect width="130" height="30" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" />
      <circle cx="15" cy="15" r="4" fill="#10b981" />
      <text x="26" y="19" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">1 420+ Mitingów</text>
    </g>
  </g>

  <!-- Filter Pills -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="105" height="28" rx="14" fill="#0284c7" />
    <text x="18" y="18" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Wszystkie (All)</text>

    <rect x="115" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="rgba(255,255,255,0.1)" />
    <text x="130" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="500">Mitingi AA / NA</text>

    <rect x="255" y="0" width="125" height="28" rx="14" fill="#1e293b" stroke="rgba(255,255,255,0.1)" />
    <text x="270" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="500">Mityngi Online 24/7</text>

    <rect x="390" y="0" width="120" height="28" rx="14" fill="#1e293b" stroke="rgba(255,255,255,0.1)" />
    <text x="405" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="500">Dla Bliskich (Al-Anon)</text>
  </g>

  <!-- Glowing Map Pin 1 (Center-Left) -->
  <g transform="translate(240, 240)">
    <!-- Pulse ring -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="10;35;45" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.3;0" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="16" fill="url(#tm-pin-grad)" filter="url(#tm-glow)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    
    <!-- Popup Card -->
    <g transform="translate(20, -50)">
      <rect width="180" height="66" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" filter="drop-shadow(0 8px 20px rgba(0,0,0,0.6))" />
      <text x="12" y="20" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="800">DZIŚ 19:00 • STACJONARNY</text>
      <text x="12" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Grupa „Nowe Życie”</text>
      <text x="12" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">Sala parafialna • Dostępna rampa</text>
    </g>
  </g>

  <!-- Map Pin 2 (Center-Right) -->
  <g transform="translate(560, 220)">
    <circle cx="0" cy="0" r="14" fill="#06b6d4" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
    <!-- Mini Popup -->
    <g transform="translate(-100, -52)">
      <rect width="150" height="42" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.15)" />
      <text x="10" y="18" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="800">● OTWARTY ZA 35 MIN</text>
      <text x="10" y="32" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Grupa „Przystań”</text>
    </g>
  </g>

  <!-- Map Pin 3 (Bottom-Center) -->
  <g transform="translate(380, 420)">
    <circle cx="0" cy="0" r="14" fill="#3b82f6" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>

  <!-- Bottom Featured Banner / Drawer -->
  <g transform="translate(40, 470)">
    <rect width="720" height="96" rx="16" fill="url(#tm-card-bg)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.6))" />
    
    <g transform="translate(24, 24)">
      <circle cx="24" cy="24" r="22" fill="#0284c7" opacity="0.2" />
      <circle cx="24" cy="24" r="14" fill="#0284c7" />
      <path d="M 24 16 L 27 24 L 32 24 L 28 28 L 30 34 L 24 30 L 18 34 L 20 28 L 16 24 L 21 24 Z" fill="#ffffff" />
      
      <text x="60" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">Trzeźwa Mapa — Bezpieczna Przystań w Twojej Okolicy</text>
      <text x="60" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">100% anonimowe wyszukiwanie grup wsparcia, punktów konsultacyjnych i telefonów zaufania w całej Polsce.</text>
    </g>

    <!-- Action Button inside card -->
    <g transform="translate(560, 30)">
      <rect width="136" height="38" rx="10" fill="url(#tm-accent)" />
      <text x="24" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="0.4">OTWÓRZ MAPĘ →</text>
    </g>
  </g>
</svg>
